# Checks the status of the shipments not yet delivered with their carriers,
# every 8 hours (06:00, 14:00 and 22:00 in Bogotá). Vercel Hobby only allows
# daily crons, so GitHub calls the endpoint instead. Also runs by hand from
# the Actions tab.
#
# Needs repository secrets:
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
#   APP_URL      the production URL, e.g. https://cafeamantti.com
name: Shipments tracking

on:
  schedule:
    - cron: "0 3,11,19 * * *"
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check open shipments
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "Missing CRON_SECRET or APP_URL secret"; exit 1
          fi
          curl --fail-with-body -sS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/shipments-tracking"
