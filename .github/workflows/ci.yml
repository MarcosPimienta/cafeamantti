# Runs on every push and pull request: type check, tests and a production
# build. A red check here means "do not deploy this commit".
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build only needs these to exist; no real project is contacted.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_EPAYCO_PUBLIC_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same Node as local development (jsdom/undici need >= 22.22).
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The codebase still carries older lint errors; report them without
      # blocking until they are cleaned up, then drop continue-on-error.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true
